<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深蓝象限 Aqua | Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--accent:#7ee7d8;
--glass:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:"Noto Sans SC",sans-serif;
background:#02121f;
color:white;
overflow-x:hidden;
}
.hero{
height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}
.hero::before{
content:"";
position:absolute;inset:0;
background:
linear-gradient(rgba(2,18,31,.35),rgba(2,18,31,.75)),
url('https://images.unsplash.com/photo-1518399681705-1c1a55e5e883?auto=format&fit=crop&w=2000&q=80');
background-size:cover;
background-position:center;
animation:zoom 20s ease-in-out infinite alternate;
}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero-content{position:relative;z-index:2;max-width:900px;padding:20px}
h1{font-size:5rem;margin-bottom:20px}
.subtitle{font-size:1.4rem;opacity:.9;line-height:1.8}
.btn{
display:inline-block;margin-top:30px;padding:16px 34px;
border-radius:999px;background:var(--glass);
backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15)
}
section{padding:100px 8%}
.title{text-align:center;font-size:2.6rem;margin-bottom:15px}
.desc{text-align:center;opacity:.75;margin-bottom:50px}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:28px;
}
.card{
background:var(--glass);
backdrop-filter:blur(18px);
border-radius:24px;
padding:28px;
border:1px solid rgba(255,255,255,.08);
transition:.4s;
}
.card:hover{transform:translateY(-10px)}
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}
.gallery img{
width:100%;height:320px;object-fit:cover;border-radius:20px;
}
.quote{
padding:120px 10%;
text-align:center;
background:linear-gradient(180deg,#06233b,#03111f);
}
.quote p{font-size:2rem;line-height:1.8;max-width:900px;margin:auto}
footer{text-align:center;padding:60px;opacity:.7}
</style>
</head>
<body>

<header class="hero">
<div class="hero-content">
<h1>深蓝象限 Aqua</h1>
<p class="subtitle">
探索自由潜水的科学与艺术<br>
从科普、训练、装备到考证，建立系统化深海知识体系
</p>
<div class="btn">进入深蓝世界</div>
</div>
</header>

<section>
<h2 class="title">知识矩阵</h2>
<p class="desc">专业内容 × 海洋美学 × 潜水成长</p>
<div class="grid">
<div class="card"><h3>自由潜科普</h3><p>潜水反射、血液转移、肺部适应、压力变化与风险管理。</p></div>
<div class="card"><h3>技巧进阶</h3><p>鸭式入水、Frenzel、Mouthfill、自由下降与训练规划。</p></div>
<div class="card"><h3>装备实验室</h3><p>长脚蹼、面镜、湿衣、配重系统评测与养护。</p></div>
<div class="card"><h3>考证中心</h3><p>AIDA、SSI、PADI 理论考点与备考经验。</p></div>
</div>
</section>

<section>
<h2 class="title">海洋影像</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80">
<img src="https://images.unsplash.com/photo-1551244072-5d12893278ab?auto=format&fit=crop&w=1200&q=80">
<img src="https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?auto=format&fit=crop&w=1200&q=80">
</div>
</section>

<section class="quote">
<p>
“自由潜水不仅是向下探索，
更是向内认识自己。”
</p>
</section>

<footer>
深蓝象限 Aqua · Freediving Knowledge Platform
</footer>

</body>
</html>
